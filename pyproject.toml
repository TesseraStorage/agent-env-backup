[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-env-backup"
version = "0.1.0"
description = "Human-controlled encrypted backup/restore CLI for agent environments. Local-first, permissively licensed, no privileged paths."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "agent-env-backup contributors" }]
keywords = ["backup", "encryption", "agent", "cli", "restore"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Archiving :: Backup",
]
dependencies = [
    "PyYAML>=6.0",
    "cryptography>=41.0",
]

[project.scripts]
agent-env-backup = "agent_env_backup.cli:main"

[tool.setuptools.packages.find]
include = ["agent_env_backup*"]
